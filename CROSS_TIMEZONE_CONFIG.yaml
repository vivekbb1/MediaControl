# CROSS-TIMEZONE STB CONFIGURATION
# Indian STB (Airtel/Jio) installed in Dubai with time adjustment

# ==============================================================================
# USE CASE: Indian STB in Dubai
# ==============================================================================
# - STB broadcasts in IST (Indian Standard Time - UTC+5:30)
# - Viewer location: Dubai (GST - Gulf Standard Time - UTC+4:00)
# - Time difference: IST is 1.5 hours ahead of GST
# - Example: 8:00 PM IST = 6:30 PM GST
#
# The EPG client automatically converts all show times from IST to GST!
# ==============================================================================

displays:
  # ============================================================================
  # INDIAN STB IN DUBAI - AUTOMATIC TIME CONVERSION
  # ============================================================================
  dubai_living_room:
    title: Dubai Living Room (Indian STB)
    model: WM55B + Airtel/Jio STB
    ip: 192.168.1.100
    location: dubai
    
    # Broadlink IR Control
    broadlink:
      host: 192.168.1.150
      mac: "24:DF:A7:F9:4D:84"
      device_type: 0x61A2  # RM4 Mini
    
    # EPG Configuration with CROSS-TIMEZONE Support
    epg:
      enabled: true
      
      # IMPORTANT: Set country_code to India for logo fetching
      country_code: "in"
      
      # CRITICAL: Set timezone to YOUR LOCAL TIME (Dubai)
      # All EPG times will be automatically converted from IST to GST!
      timezone: "Asia/Dubai"  # GST (UTC+4) - Your viewing location
      
      # EPG sources are in IST (Indian time) - will be auto-converted
      sources:
        # JioTV EPG - times are in IST
        - url: "https://avkb.short.gy/epg.xml.gz"
          priority: 1
          source_timezone: "Asia/Kolkata"  # Optional: explicitly set source timezone
        
        # Backup EPG
        - url: "https://github.com/arnab8820/JioTV-epg/raw/main/epg.xml.gz"
          priority: 2
      
      # Display options
      display:
        show_timezone: true  # Show "GST" or "Dubai Time" in UI
        time_format: "12h"   # 12-hour format (8:30 PM) or "24h" (20:30)
        show_now_next: true
        hours_ahead: 8
      
      # Indian channels with Airtel channel numbers
      channels:
        # Hindi Entertainment
        - name: "Star Plus HD"
          epg_id: "461"
          channel_number: 109
          ir_command: "num_1,num_0,num_9"
          category: "Hindi Entertainment"
          # EPG shows: "Mon 8:00 PM IST" → displays as "Mon 6:30 PM GST"
        
        - name: "Sony Entertainment HD"
          epg_id: "291"
          channel_number: 107
          ir_command: "num_1,num_0,num_7"
          category: "Hindi Entertainment"
        
        - name: "Zee TV HD"
          epg_id: "473"
          channel_number: 105
          ir_command: "num_1,num_0,num_5"
          category: "Hindi Entertainment"
        
        - name: "Colors HD"
          epg_id: "144"
          channel_number: 111
          ir_command: "num_1,num_1,num_1"
          category: "Hindi Entertainment"
        
        # Hindi Movies
        - name: "Sony MAX HD"
          epg_id: "476"
          channel_number: 404
          ir_command: "num_4,num_0,num_4"
          category: "Hindi Movies"
        
        - name: "Zee Cinema HD"
          epg_id: "821"
          channel_number: 401
          ir_command: "num_4,num_0,num_1"
          category: "Hindi Movies"
        
        # Sports
        - name: "Sony Ten 1 HD"
          epg_id: "284"
          channel_number: 277
          ir_command: "num_2,num_7,num_7"
          category: "Sports"
        
        - name: "Star Sports 1 HD"
          epg_id: "480"
          channel_number: 272
          ir_command: "num_2,num_7,num_2"
          category: "Sports"
        
        # News
        - name: "Aaj Tak HD"
          epg_id: "216"
          channel_number: 313
          ir_command: "num_3,num_1,num_3"
          category: "News"
        
        - name: "NDTV India"
          epg_id: "156"
          channel_number: 317
          ir_command: "num_3,num_1,num_7"
          category: "News"

# ==============================================================================
# HOW IT WORKS - TIME CONVERSION EXAMPLES
# ==============================================================================

# Indian EPG broadcasts times in IST (UTC+5:30)
# You're viewing in Dubai with GST (UTC+4:00)
# Difference: 1 hour 30 minutes

# Conversion Examples:
#
#   IST (Mumbai)  →  GST (Dubai)
#   ────────────────────────────
#   6:00 AM       →  4:30 AM
#   8:00 AM       →  6:30 AM
#   12:00 PM      →  10:30 AM
#   3:00 PM       →  1:30 PM
#   6:00 PM       →  4:30 PM
#   8:00 PM       →  6:30 PM  (Prime time!)
#   10:00 PM      →  8:30 PM
#   12:00 AM      →  10:30 PM

# Popular Indian Prime Time Shows (IST → GST):
#   - "Anupamaa" on Star Plus: 8:00 PM IST → 6:30 PM GST
#   - "Kundali Bhagya" on Zee TV: 9:30 PM IST → 8:00 PM GST
#   - "Kaun Banega Crorepati": 9:00 PM IST → 7:30 PM GST

# ==============================================================================
# REVERSE SCENARIO: UAE STB IN INDIA
# ==============================================================================

# If you have a UAE STB (e&/du/OSN) installed in India:

displays:
  mumbai_living_room_uae_stb:
    title: Mumbai (UAE STB)
    location: mumbai
    
    broadlink:
      host: 192.168.1.151
      mac: "24:DF:A7:F9:4D:85"
    
    epg:
      enabled: true
      country_code: "ae"  # For UAE channel logos
      timezone: "Asia/Kolkata"  # IST - Your viewing location (Mumbai)
      
      sources:
        # OSN EPG - times are in GST
        - url: "https://iptv-org.github.io/epg/guides/ae-en/osn.com.epg.xml"
          source_timezone: "Asia/Dubai"  # Source is in GST
      
      # Times will convert: GST → IST (add 1.5 hours)
      #   6:00 PM GST → 7:30 PM IST
      #   8:00 PM GST → 9:30 PM IST
      
      channels:
        - name: "Star World HD"
          epg_id: "StarWorld.uk@SD"
          channel_number: 188
          ir_command: "num_1,num_8,num_8"

# ==============================================================================
# MULTI-ROOM WITH DIFFERENT TIMEZONES
# ==============================================================================

# Example: You have homes in multiple countries

displays:
  # Home in Dubai - Indian STB
  dubai_home:
    title: Dubai Home
    location: dubai
    epg:
      country_code: "in"
      timezone: "Asia/Dubai"  # GST
      sources:
        - url: "https://avkb.short.gy/epg.xml.gz"
    broadlink:
      host: 192.168.1.150
  
  # Home in Mumbai - Indian STB
  mumbai_home:
    title: Mumbai Home
    location: mumbai
    epg:
      country_code: "in"
      timezone: "Asia/Kolkata"  # IST
      sources:
        - url: "https://avkb.short.gy/epg.xml.gz"
    broadlink:
      host: 192.168.2.150
  
  # Home in London - Indian STB
  london_home:
    title: London Home
    location: london
    epg:
      country_code: "in"
      timezone: "Europe/London"  # GMT/BST
      sources:
        - url: "https://avkb.short.gy/epg.xml.gz"
    # IST to GMT: subtract 5.5 hours (or 4.5 during BST)
    # 8:00 PM IST → 2:30 PM GMT (1:30 PM BST)
    broadlink:
      host: 192.168.3.150

