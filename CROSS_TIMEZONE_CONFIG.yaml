# ==============================================================================
# TIMEZONE REFERENCE
# ==============================================================================

# Common timezones for Indian expats:

# UAE (Dubai, Abu Dhabi):
timezone: "Asia/Dubai"           # GST (UTC+4)
# Difference from IST: -1:30

# Saudi Arabia:
timezone: "Asia/Riyadh"          # AST (UTC+3)
# Difference from IST: -2:30

# Qatar:
timezone: "Asia/Qatar"           # AST (UTC+3)
# Difference from IST: -2:30

# Oman:
timezone: "Asia/Muscat"          # GST (UTC+4)
# Difference from IST: -1:30

# Kuwait:
timezone: "Asia/Kuwait"          # AST (UTC+3)
# Difference from IST: -2:30

# Bahrain:
timezone: "Asia/Bahrain"         # AST (UTC+3)
# Difference from IST: -2:30

# UK:
timezone: "Europe/London"        # GMT/BST (UTC+0/+1)
# Difference from IST: -5:30 (GMT) or -4:30 (BST)

# USA East Coast:
timezone: "America/New_York"     # EST/EDT (UTC-5/-4)
# Difference from IST: -10:30 (EST) or -9:30 (EDT)

# Singapore:
timezone: "Asia/Singapore"       # SGT (UTC+8)
# Difference from IST: +2:30

# Australia (Sydney):
timezone: "Australia/Sydney"     # AEDT/AEST (UTC+11/+10)
# Difference from IST: +5:30 (AEST) or +6:30 (AEDT)

# ==============================================================================
# IMPORTANT NOTES
# ==============================================================================

# 1. XMLTV Format Already Includes Timezone
#    - EPG data includes timezone offset: "20260731200000 +0530"
#    - The +0530 means IST (UTC+5:30)
#    - Our parser automatically converts this to your target timezone
#
# 2. No Manual Calculation Needed
#    - Just set "timezone" to your viewing location
#    - The system handles all conversions automatically
#
# 3. Daylight Saving Time (DST)
#    - Some regions use DST (UK, USA, Australia)
#    - The system automatically handles DST transitions
#    - India and UAE don't use DST (no changes year-round)
#
# 4. Channel Logos
#    - Use country_code: "in" for Indian channel logos
#    - Use country_code: "ae" for UAE channel logos
#    - The country_code only affects logos, not time conversion
#
# 5. Multiple EPG Sources
#    - You can mix Indian EPG + UAE EPG in same config
#    - Each source can have different timezone
#    - All times convert to your target timezone
#
# 6. UI Display
#    - Show times display in your local timezone
#    - Optionally show timezone label ("GST", "IST")
#    - "Now Playing" detection uses your local time

