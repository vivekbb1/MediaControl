# ==============================================================================
# QUICK START - INDIAN STB IN DUBAI
# ==============================================================================

# 1. Copy this configuration to displays.yaml

# 2. Update IPs and MAC addresses:
#    - Flip display IP
#    - Broadlink device IP and MAC

# 3. Verify timezone is set to Dubai:
#    timezone: "Asia/Dubai"

# 4. Install dependencies:
#    pip3 install -r requirements.txt

# 5. Test EPG:
#    python3 epg_client.py https://avkb.short.gy/epg.xml.gz

# 6. Learn IR codes for your STB:
#    python3 broadlink_client.py --learn --host 192.168.1.150

# 7. Start server:
#    python3 server.py 8080

# 8. Access from browser:
#    http://192.168.1.100:8080/app/

# 9. Verify times are showing in GST (Dubai time)
#    - Check "Now Playing" matches your wall clock
#    - Prime time shows should be around 6:30-8:30 PM GST

# ==============================================================================
# SUPPORT
# ==============================================================================

# If times are not converting correctly:
# 1. Check timezone setting matches your location exactly
# 2. Verify EPG source is loading (check logs)
# 3. Confirm system time is correct: date
# 4. Test timezone: python3 -c "from zoneinfo import ZoneInfo; print(ZoneInfo('Asia/Dubai'))"
