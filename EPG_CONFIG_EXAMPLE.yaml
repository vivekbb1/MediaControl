# EPG (Electronic Program Guide) Configuration Example

# Add this to your displays.yaml to enable EPG guide with channel logos

displays:
  living_room:
    title: Living Room
    model: WM55B + IPTV
    ip: 192.168.1.100
    
    # Broadlink for STB control
    broadlink:
      host: 192.168.1.150
      mac: "24:DF:A7:F9:4D:84"
      device_type: 0x61A2
    
    # EPG Configuration
    epg:
      enabled: true
      country_code: "us"  # For channel logo matching
      timezone: "America/New_York"  # Local timezone for show times
      
      # EPG Data Sources (XMLTV format)
      sources:
        # Official iptv-org EPG (recommended)
        - url: "https://iptv-org.github.io/epg/guides/us.xml"
          priority: 1
        
        # Alternative: Compressed format (faster)
        - url: "https://iptv-org.github.io/epg/guides/us.xml.gz"
          priority: 2
        
        # You can add multiple sources - they'll be merged
        - url: "https://iptv-org.github.io/epg/guides/ca.xml"
          priority: 3
      
      # Channel Mapping (link EPG channel IDs to your IR commands)
      channels:
        - name: "CNN"
          epg_id: "CNN.us"  # XMLTV channel ID
          channel_number: 202  # Your STB channel number
          ir_command: "num_2,num_0,num_2"  # IR sequence to tune
          logo_override: null  # Optional: custom logo URL
        
        - name: "ESPN"
          epg_id: "ESPN.us"
          channel_number: 206
          ir_command: "num_2,num_0,num_6"
        
        - name: "HBO"
          epg_id: "HBO.us"
          channel_number: 300
          ir_command: "num_3,num_0,num_0"
        
        - name: "Discovery Channel"
          epg_id: "DiscoveryChannel.us"
          channel_number: 278
          ir_command: "num_2,num_7,num_8"
        
        - name: "National Geographic"
          epg_id: "NationalGeographic.us"
          channel_number: 276
          ir_command: "num_2,num_7,num_6"
        
        - name: "Fox News"
          epg_id: "FoxNews.us"
          channel_number: 205
          ir_command: "num_2,num_0,num_5"
        
        - name: "NBC"
          epg_id: "NBC.us"
          channel_number: 4
          ir_command: "num_4"
        
        - name: "ABC"
          epg_id: "ABC.us"
          channel_number: 7
          ir_command: "num_7"
      
      # Update Schedule
      update:
        interval_hours: 6  # Update EPG every 6 hours
        auto_update: true
        retry_on_failure: true
      
      # Cache Settings
      cache:
        enabled: true
        max_age_hours: 12
        directory: "./epg_cache"
      
      # Display Options
      display:
        show_now_next: true  # Show current & next programme
        hours_ahead: 8  # Show programmes for next 8 hours
        show_descriptions: true
        show_categories: true
        show_episode_numbers: true

# -----------------------------------------------------------------------------
# Multi-Room EPG Setup
# -----------------------------------------------------------------------------

displays:
  bedroom:
    title: Bedroom
    epg:
      enabled: true
      country_code: "us"
      timezone: "America/Los_Angeles"  # Pacific time
      sources:
        - url: "https://iptv-org.github.io/epg/guides/us.xml.gz"
      channels:
        - name: "Local News"
          epg_id: "KABC.us"
          channel_number: 7
          ir_command: "num_7"

  guest_room:
    title: Guest Room
    epg:
      enabled: true
      country_code: "uk"  # UK channels
      timezone: "Europe/London"
      sources:
        - url: "https://iptv-org.github.io/epg/guides/uk.xml.gz"
      channels:
        - name: "BBC One"
          epg_id: "BBCOne.uk"
          channel_number: 101
          ir_command: "num_1,num_0,num_1"

