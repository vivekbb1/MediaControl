# -----------------------------------------------------------------------------

# All show times are automatically converted to your local timezone.
# Use standard timezone names (IANA Time Zone Database):

# Americas:
#   - America/New_York (EST/EDT)
#   - America/Chicago (CST/CDT)
#   - America/Denver (MST/MDT)
#   - America/Los_Angeles (PST/PDT)
#   - America/Toronto
#   - America/Vancouver
#   - America/Mexico_City

# Europe:
#   - Europe/London
#   - Europe/Paris
#   - Europe/Berlin
#   - Europe/Rome
#   - Europe/Madrid
#   - Europe/Amsterdam

# Asia:
#   - Asia/Dubai
#   - Asia/Kolkata
#   - Asia/Tokyo
#   - Asia/Seoul
#   - Asia/Shanghai
#   - Asia/Singapore

# Oceania:
#   - Australia/Sydney
#   - Australia/Melbourne
#   - Pacific/Auckland

# Full list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# -----------------------------------------------------------------------------
# Finding EPG Channel IDs
# -----------------------------------------------------------------------------

# Method 1: Download and inspect the XMLTV file
# wget https://iptv-org.github.io/epg/guides/us.xml
# grep -A 2 '<channel id=' us.xml | head -30

# Method 2: Use the EPG client tool
# python3 epg_client.py https://iptv-org.github.io/epg/guides/us.xml.gz

# Method 3: Browse the iptv-org database
# https://github.com/iptv-org/database

# -----------------------------------------------------------------------------
# Custom EPG Sources
# -----------------------------------------------------------------------------

# You can use any XMLTV-format EPG source:

epg:
  sources:
    # Local file
    - url: "file:///path/to/custom_epg.xml"
      priority: 1
    
    # Custom web source
    - url: "https://your-epg-provider.com/guide.xml.gz"
      priority: 2
    
    # Multiple sources are merged automatically
    - url: "https://iptv-org.github.io/epg/guides/us.xml.gz"
      priority: 3

# -----------------------------------------------------------------------------
# IR Command Sequences
# -----------------------------------------------------------------------------

# For multi-digit channels, use comma-separated IR commands:

channels:
  - name: "Channel 202"
    ir_command: "num_2,num_0,num_2"  # Press 2, then 0, then 2
  
  - name: "Channel 1005"
    ir_command: "num_1,num_0,num_0,num_5"  # Press 1, 0, 0, 5
  
  # Some STBs need a delay between digits
  - name: "Channel 50"
    ir_command: "num_5,wait_100ms,num_0"  # Wait 100ms between digits
  
  # Some STBs require pressing OK/Enter after channel number
  - name: "Channel 123"
    ir_command: "num_1,num_2,num_3,ok"  # Then press OK

# -----------------------------------------------------------------------------
# Advanced: Channel Favorites
# -----------------------------------------------------------------------------

epg:
  favorites:
    - epg_id: "CNN.us"
    - epg_id: "ESPN.us"
    - epg_id: "HBO.us"
  
  # Favorites appear first in channel list

# -----------------------------------------------------------------------------
# Advanced: Genre Filtering
# -----------------------------------------------------------------------------

epg:
  genre_filter:
    show: ["News", "Sports", "Movies"]  # Only show these genres
    hide: ["Shopping", "Infomercials"]  # Hide these genres

# -----------------------------------------------------------------------------
