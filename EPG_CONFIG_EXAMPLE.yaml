# -----------------------------------------------------------------------------
# Channel Logo Sources
# -----------------------------------------------------------------------------

# Logos are automatically fetched from:
# https://github.com/tv-logo/tv-logos

# Format: https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/{country}/{channel-name-country.png}

# Examples:
# US:  https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/united-states/cnn-us.png
# UK:  https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/united-kingdom/bbc-one-hd-uk.png
# CA:  https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/canada/ctv-ca.png

# HD logos (when available):
# https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/united-states/hd/espn-us.png

