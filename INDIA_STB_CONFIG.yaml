# INDIA STB CONFIGURATION - Airtel/Jio/Tata Play
# Complete setup for Indian set-top boxes with EPG and channel logos

displays:
  # ============================================================================
  # AIRTEL DIGITAL TV / AIRTEL XSTREAM SETUP
  # ============================================================================
  living_room_airtel:
    title: Living Room (Airtel)
    model: WM55B + Airtel STB
    ip: 192.168.1.100
    location: home
    
    # Broadlink IR Control for Airtel STB
    broadlink:
      host: 192.168.1.150
      mac: "24:DF:A7:F9:4D:84"
      device_type: 0x61A2  # RM4 Mini
    
    # EPG Configuration for India
    epg:
      enabled: true
      country_code: "in"
      timezone: "Asia/Kolkata"  # Indian Standard Time (IST)
      
      # Indian EPG Sources
      sources:
        # Primary: Tata Play + JioTV combined
        - url: "https://avkb.short.gy/epg.xml.gz"
          priority: 1
        
        # JioTV 7-day EPG (backup)
        - url: "https://github.com/arnab8820/JioTV-epg/raw/main/epg.xml.gz"
          priority: 2
        
        # India general (iptv-org)
        - url: "https://iptv-org.github.io/epg/guides/in.xml.gz"
          priority: 3
      
      # Popular Indian Channels - Airtel Channel Numbers
      channels:
        # Hindi Entertainment
        - name: "Star Plus HD"
          epg_id: "461"  # JioTV ID
          channel_number: 109
          ir_command: "num_1,num_0,num_9"
          category: "Hindi Entertainment"
        
        - name: "Sony Entertainment HD"
          epg_id: "291"
          channel_number: 107
          ir_command: "num_1,num_0,num_7"
          category: "Hindi Entertainment"
        
        - name: "Zee TV HD"
          epg_id: "473"
          channel_number: 105
          ir_command: "num_1,num_0,num_5"
          category: "Hindi Entertainment"
        
        - name: "Colors HD"
          epg_id: "144"
          channel_number: 111
          ir_command: "num_1,num_1,num_1"
          category: "Hindi Entertainment"
        
        - name: "Star Bharat HD"
          epg_id: "503"
          channel_number: 121
          ir_command: "num_1,num_2,num_1"
          category: "Hindi Entertainment"
        
        # Hindi Movies
        - name: "Sony MAX HD"
          epg_id: "476"
          channel_number: 404
          ir_command: "num_4,num_0,num_4"
          category: "Hindi Movies"
        
        - name: "Zee Cinema HD"
          epg_id: "821"
