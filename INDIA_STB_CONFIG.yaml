  # JIOTV / JIO FIBER STB SETUP
  # ============================================================================
  bedroom_jio:
    title: Bedroom (JioTV)
    model: WM55B + Jio STB
    ip: 192.168.1.101
    location: home
    
    broadlink:
      host: 192.168.1.151
      mac: "24:DF:A7:F9:4D:85"
      device_type: 0x61A2
    
    epg:
      enabled: true
      country_code: "in"
      timezone: "Asia/Kolkata"
      
      sources:
        # JioTV-specific EPG (primary)
        - url: "https://avkb.short.gy/jioepg.xml.gz"
          priority: 1
        
        # Full 7-day backup
        - url: "https://github.com/arnab8820/JioTV-epg/raw/main/epg.xml.gz"
          priority: 2
      
      # JioTV uses different channel numbers than Airtel
