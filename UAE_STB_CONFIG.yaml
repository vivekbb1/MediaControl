# ==============================================================================
# E& / DU CHANNEL PACKAGES
# ==============================================================================

# e& (Etisalat) Packages:
#   - eLife Plans: Basic entertainment channels
#   - OSN Add On: Premium OSN channels
#   - Western Pack: International channels
#   - Sports Pack: beIN Sports, AD Sports
#   - Pinoy Pack: Filipino channels
#   - Asiana Pack: Asian channels

# du Packages:
#   - Basic: Local channels + basic entertainment
#   - Entertainment Plus: OSN channels
#   - Sports: beIN Sports
#   - Premium: All channels

# OSN Packages:
#   - OSN Starter: Basic channels
#   - OSN Ultimate: All channels
#   - OSN Sports: beIN Sports
#   - Individual channel subscriptions available

# ==============================================================================
# TIMEZONE NOTES
# ==============================================================================

# UAE uses a single timezone: Asia/Dubai (GST - UTC+4)
# All EPG times are automatically converted to GST
# No daylight saving time adjustments

# ==============================================================================
# LANGUAGE SUPPORT
# ==============================================================================

# EPG available in:
#   - English: ae-en/osn.com.epg.xml
#   - Arabic: ae-ar/osn.com.epg.xml

# Set language in display config:
# epg:
#   language: "en"  # or "ar" for Arabic
#   sources:
#     - url: "https://iptv-org.github.io/epg/guides/ae-en/osn.com.epg.xml"  # English
#     # or
#     - url: "https://iptv-org.github.io/epg/guides/ae-ar/osn.com.epg.xml"  # Arabic

# ==============================================================================
# TESTING
# ==============================================================================

# Test EPG fetching:
# python3 epg_client.py https://iptv-org.github.io/epg/guides/ae-en/osn.com.epg.xml

# Test channel logo:
# python3 epg_client.py logo "OSN" ae

# View e& channel list:
# https://www.etisalat.ae/en/mshop/home/plans/details/channel-list/osn.html

# View du channel list:
# https://www.du.ae/personal/tv/channel-list

# View OSN channel guide:
# https://www.osn.com/en-ae/watch/tv-schedule

# ==============================================================================
# IMPORTANT NOTES
# ==============================================================================

# 1. e& and du both use OSN for premium content
# 2. Channel numbers may vary between providers - check your STB guide
# 3. OSN EPG includes both Arabic and English metadata
# 4. Some channels may require specific package subscriptions
# 5. beIN Sports EPG may be limited due to live sports variations
# 6. IR codes for UAE STBs may vary - learn your specific remote codes
