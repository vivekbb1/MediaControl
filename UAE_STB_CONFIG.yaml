# UAE STB CONFIGURATION - e&/du/OSN
# Complete setup for UAE set-top boxes with EPG and channel logos

displays:
  # ============================================================================
  # E& (ETISALAT) SETUP
  # ============================================================================
  living_room_etisalat:
    title: Living Room (e& / Etisalat)
    model: WM55B + e& eLife STB
    ip: 192.168.1.100
    location: home
    
    # Broadlink IR Control for e& STB
    broadlink:
      host: 192.168.1.150
      mac: "24:DF:A7:F9:4D:84"
      device_type: 0x648D  # RM4 Pro (supports IR + RF)
    
    # EPG Configuration for UAE
    epg:
      enabled: true
      country_code: "ae"
      timezone: "Asia/Dubai"  # UAE Standard Time (UTC+4)
      
      # UAE EPG Sources
      sources:
        # OSN English (primary for international channels)
        - url: "https://iptv-org.github.io/epg/guides/ae-en/osn.com.epg.xml"
          priority: 1
        
        # OSN Arabic (for Arabic channels)
        - url: "https://iptv-org.github.io/epg/guides/ae-ar/osn.com.epg.xml"
          priority: 2
        
        # General UAE EPG (iptv-org)
        - url: "https://iptv-org.github.io/epg/guides/ae.xml.gz"
          priority: 3
      
      # Popular e&/OSN Channels
      channels:
        # English Entertainment
        - name: "Star World HD"
          epg_id: "StarWorld.uk@SD"
          channel_number: 188
          ir_command: "num_1,num_8,num_8"
          category: "English Entertainment"
        
        - name: "Comedy Central"
          epg_id: "ComedyCentral.uk@SD"
          channel_number: 360
          ir_command: "num_3,num_6,num_0"
          category: "English Entertainment"
        
        - name: "OSNtv Showcase"
          epg_id: "OSNtvShowcase.ae@SD"
          channel_number: 646
          ir_command: "num_6,num_4,num_6"
          category: "English Entertainment"
        
        # Arabic Entertainment
        - name: "OSNtv Yahala"
          epg_id: "OSNtvYahala.ae@SD"
          channel_number: 171
          ir_command: "num_1,num_7,num_1"
          category: "Arabic Entertainment"
        
        - name: "MBC Drama"
          epg_id: "MBCDrama.ae@SD"
          channel_number: 401
          ir_command: "num_4,num_0,num_1"
          category: "Arabic Entertainment"
        
        # Sports
        - name: "beIN Sports 1"
          epg_id: "beINSports1.ae@SD"
          channel_number: 700
          ir_command: "num_7,num_0,num_0"
          category: "Sports"
        
        - name: "AD Sports 1"
          epg_id: "ADSports1.ae@SD"
          channel_number: 201
          ir_command: "num_2,num_0,num_1"
          category: "Sports"
        
        - name: "Star Sports Select 1 HD"
          epg_id: "StarSportsSelect1.in@SD"
          channel_number: 461
          ir_command: "num_4,num_6,num_1"
          category: "Sports"
        
        # News
        - name: "Sky News HD"
          epg_id: "SkyNews.uk@SD"
          channel_number: 503
          ir_command: "num_5,num_0,num_3"
          category: "News"
        
        - name: "BBC World News"
          epg_id: "BBCWorldNews.uk@SD"
          channel_number: 501
          ir_command: "num_5,num_0,num_1"
          category: "News"
        
        - name: "Sky News Arabia"
          epg_id: "SkyNewsArabia.ae@SD"
          channel_number: 502
          ir_command: "num_5,num_0,num_2"
          category: "News"
        
        - name: "Al Jazeera English"
          epg_id: "AlJazeeraEnglish.qa@SD"
          channel_number: 512
          ir_command: "num_5,num_1,num_2"
          category: "News"
        
        # Movies
        - name: "OSNtv Movies Hollywood"
          epg_id: "OSNtvMoviesHollywood.ae@SD"
          channel_number: 634
          ir_command: "num_6,num_3,num_4"
          category: "Movies"
        
        - name: "OSNtv Movies Action"
          epg_id: "OSNtvMoviesAction.ae@SD"
          channel_number: 636
          ir_command: "num_6,num_3,num_6"
          category: "Movies"
        
        - name: "OSNtv Movies Family"
          epg_id: "OSNtvMoviesFamily.ae@SD"
          channel_number: 638
          ir_command: "num_6,num_3,num_8"
          category: "Movies"
        
        - name: "Star Movies HD"
          epg_id: "StarMovies.in@SD"
          channel_number: 303
          ir_command: "num_3,num_0,num_3"
          category: "Movies"
        
        # Kids
        - name: "Disney Channel HD"
          epg_id: "DisneyChannel.us@SD"
          channel_number: 319
          ir_command: "num_3,num_1,num_9"
          category: "Kids"
        
        - name: "Nickelodeon HD"
          epg_id: "Nickelodeon.us@SD"
          channel_number: 329
          ir_command: "num_3,num_2,num_9"
          category: "Kids"
        
        - name: "OSNtv Kids"
          epg_id: "OSNtvKids.ae@SD"
          channel_number: 323
