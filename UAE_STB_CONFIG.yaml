          category: "Kids"
        
        # Documentaries
        - name: "National Geographic HD"
          epg_id: "NationalGeographic.us@SD"
          channel_number: 369
          ir_command: "num_3,num_6,num_9"
          category: "Documentary"
        
        - name: "Discovery HD"
          epg_id: "Discovery.us@SD"
          channel_number: 360
          ir_command: "num_3,num_6,num_0"
          category: "Documentary"
        
        - name: "History Channel HD"
          epg_id: "History.us@SD"
          channel_number: 366
          ir_command: "num_3,num_6,num_6"
          category: "Documentary"
        
        # Music
        - name: "MTV Live HD"
          epg_id: "MTVLive.us@SD"
          channel_number: 461
          ir_command: "num_4,num_6,num_1"
          category: "Music"
        
        # Indian Channels (Popular with expats)
        - name: "Star Plus HD"
          epg_id: "StarPlus.in@SD"
          channel_number: 701
          ir_command: "num_7,num_0,num_1"
          category: "Indian Entertainment"
        
        - name: "Sony TV HD"
          epg_id: "SonyTV.in@SD"
          channel_number: 704
          ir_command: "num_7,num_0,num_4"
          category: "Indian Entertainment"
        
        - name: "Zee TV HD"
          epg_id: "ZeeTV.in@SD"
          channel_number: 702
          ir_command: "num_7,num_0,num_2"
          category: "Indian Entertainment"
  
  # ============================================================================
  # DU SETUP
  # ============================================================================
  bedroom_du:
    title: Bedroom (du)
    model: WM55B + du STB
    ip: 192.168.1.101
    location: home
    
    broadlink:
      host: 192.168.1.151
      mac: "24:DF:A7:F9:4D:85"
      device_type: 0x648D  # RM4 Pro
    
    epg:
      enabled: true
      country_code: "ae"
      timezone: "Asia/Dubai"
      
      sources:
        - url: "https://iptv-org.github.io/epg/guides/ae-en/osn.com.epg.xml"
          priority: 1
        - url: "https://iptv-org.github.io/epg/guides/ae-ar/osn.com.epg.xml"
          priority: 2
      
      # du uses similar channel numbers to e& for OSN content
      channels:
        - name: "Star World HD"
          epg_id: "StarWorld.uk@SD"
          channel_number: 300
          ir_command: "num_3,num_0,num_0"
        
        - name: "OSNtv Showcase"
          epg_id: "OSNtvShowcase.ae@SD"
          channel_number: 646
          ir_command: "num_6,num_4,num_6"
  
  # ============================================================================
  # OSN STANDALONE SETUP
  # ============================================================================
  living_room_osn:
    title: Living Room (OSN)
    model: WM55B + OSN+ STB
    ip: 192.168.1.102
    location: home
    
    broadlink:
      host: 192.168.1.152
      mac: "24:DF:A7:F9:4D:86"
      device_type: 0x648D
    
    epg:
      enabled: true
      country_code: "ae"
      timezone: "Asia/Dubai"
      
      sources:
        # OSN-specific EPG
        - url: "https://iptv-org.github.io/epg/guides/ae-en/osn.com.epg.xml"
          priority: 1
        - url: "https://iptv-org.github.io/epg/guides/ae-ar/osn.com.epg.xml"
          priority: 2
        
        # Saudi Arabia OSN (same content)
        - url: "https://iptv-org.github.io/epg/guides/sa-en/osn.com.epg.xml"
          priority: 3
        - url: "https://iptv-org.github.io/epg/guides/sa-ar/osn.com.epg.xml"
          priority: 4
      
      channels:
        # Full OSN lineup (similar to e& channels above)
        - name: "OSNtv Showcase"
          epg_id: "OSNtvShowcase.ae@SD"
          channel_number: 301
          ir_command: "num_3,num_0,num_1"

