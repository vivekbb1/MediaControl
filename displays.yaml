  billet:
    title: Billet
    model: WM55B + STB (demo)
    ip: 0.0.0.0
    port: 1515
    device_id: 0
    location: conares
    # Demo Broadlink + EPG + Beacons (dry-run until real hardware configured)
    broadlink:
      host: dry-run
      port: 80
      mac: "00:00:00:00:00:00"
      device_type: 0x61A2
      dry_run: true
    ir_codes_file: ir_codes/demo_stb.yaml
    epg:
      enabled: true
      country_code: us
      timezone: America/New_York
      sources:
      - url: https://iptv-org.github.io/epg/guides/us/tvpassport.com.xml
        priority: 1
      channels:
      - name: CNN
        epg_id: CNN.us
        channel_number: 202
        ir_command: num_2,num_0,num_2
      - name: ESPN
        epg_id: ESPN.us
        channel_number: 206
        ir_command: num_2,num_0,num_6
      - name: HBO
        epg_id: HBO.us
        channel_number: 300
        ir_command: num_3,num_0,num_0
      - name: Discovery
        epg_id: DiscoveryChannel.us
        channel_number: 278
        ir_command: num_2,num_7,num_8
      - name: Nat Geo
        epg_id: NationalGeographic.us
        channel_number: 265
        ir_command: num_2,num_6,num_5
    beacons:
      enabled: true
      beacon_id: room_billet_beacon
      protocols:
      - ibeacon
    sources:
    - id: touchscreen
      code: '0x64'
      title: Whiteboard
      enabled: true
      category: sources
      order: 2
    - id: browser
      code: '0x65'
      title: Browser
      enabled: true
      category: sources
      order: 3
    - id: usb_c
      code: '0x25'
