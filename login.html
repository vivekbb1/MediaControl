<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign in — Flip Remote</title>
  <style>
    :root {
      --bg: #0f1117; --panel: #1a1d27; --panel2: #232735; --border: #2e3344;
      --text: #e8ecf4; --muted: #8b93a7; --accent: #4f8cff; --danger: #f2555a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a2744 0%, var(--bg) 55%);
      color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px 24px;
    }
    .card {
      width: min(400px, 100%); background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px 24px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 20px; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin: 12px 0 6px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--panel2); color: var(--text); font-size: 1rem; min-height: 46px;
    }
    button {
      width: 100%; margin-top: 18px; min-height: 48px; border: none; border-radius: 12px;
      background: var(--accent); color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer;
    }
    .err { color: var(--danger); font-size: 0.85rem; margin-top: 12px; min-height: 1.2em; }
    .map { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 0.78rem; color: var(--muted); line-height: 1.45; }
    .map a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Sign in</h1>
    <p class="sub" id="subtitle">Classic remotes at <code>/</code>. New UI at <code>/app/</code>.</p>
    <form id="loginForm">
      <label for="user">Username</label>
      <input id="user" name="username" autocomplete="username" required />
      <label for="pass">Password</label>
      <input id="pass" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
      <div class="err" id="err"></div>
    </form>
    <div class="map">
      After login you’ll land on the <strong>classic remote home</strong>.
      Optional: <a href="/app/">new app UI</a> ·
      <a href="/app/d/conares/billet?tab=channels">Channels demo (Billet)</a>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get('room');
    let next = params.get('next') || '/';
    if (next.startsWith('/login')) next = '/';
    if (room) {
      document.getElementById('title').textContent = 'Room sign in';
      document.getElementById('subtitle').textContent = `Credentials for this room's remote. Admins can also sign in here.`;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('user').value.trim(),
            password: document.getElementById('pass').value,
          }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Login failed');
        if (data.user.role === 'room') {
          location.href = data.user.remote_url || '/';
        } else {
          location.href = next || '/';
        }
      } catch (ex) {
        err.textContent = ex.message;
      }
    });
  </script>
</body>
</html>
