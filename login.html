<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — TV Remote</title>
  <style>
    :root {
      --bg: #0f1117; --panel: #1a1d27; --panel2: #232735; --border: #2e3344;
      --text: #e8ecf4; --muted: #8b93a7; --accent: #4f8cff; --danger: #f2555a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; background: var(--panel2); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 12px; margin-bottom: 14px; font-size: 1rem;
    }
    button {
      width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; min-height: 48px;
    }
    .err { color: var(--danger); font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Sign in</h1>
    <p id="subtitle">Admin: full access to all rooms. Room user: remote only.</p>
    <form id="loginForm">
      <label for="user">Username</label>
      <input id="user" name="username" autocomplete="username" required />
      <label for="pass">Password</label>
      <input id="pass" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get('room');
    let next = params.get('next') || '/app/';
    if (next === '/' || next === '/index.html') next = '/app/';
    if (next.startsWith('/d/')) next = '/app' + next;
    if (next.startsWith('/login')) next = '/app/login';
    if (room) {
      document.getElementById('title').textContent = 'Room sign in';
      document.getElementById('subtitle').textContent = `Credentials for this room's remote. Admins can also sign in here.`;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('user').value.trim(),
            password: document.getElementById('pass').value,
          }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Login failed');
        if (data.user.role === 'room') {
          const remote = data.user.remote_url || '/app/';
          location.href = remote.startsWith('/app') ? remote : (remote.startsWith('/d/') ? '/app' + remote : '/app/');
        } else {
          location.href = next || '/app/';
        }
      } catch (ex) {
        err.textContent = ex.message;
      }
    });
  </script>
</body>
</html>
